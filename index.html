<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store Prime</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      margin: 0;
      padding: 24px 16px;
      text-align: center;
    }
    h1 {
      color: #38bdf8;
      font-size: 26px;
      margin-bottom: 6px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 0;
    }
    .badge {
      display: inline-block;
      background: #1f2937;
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 20px;
      border: 1px solid #374151;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      margin-top: 15px;
    }
    .btn {
      display: block;
      width: calc(100% - 32px);
      margin: 15px auto 0;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="badge">Official Web App</div>
  <h1>App Store Prime</h1>
  <p>টেলিগ্রাম ডিজিটাল অ্যাপ হাব</p>

  <div class="card">
    <h3 style="margin-top:0;">স্বাগতম!</h3>
    <p>অ্যাপ স্টোর প্রাইমের মাধ্যমে সহজে ডিজিটাল সেবা ও টুলস খুঁজে নিন।</p>
    <a href="https://t.me/AppStoreprime_Bot" class="btn">Explore Store</a>
  </div>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
